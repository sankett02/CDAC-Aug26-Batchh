<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="#f8fafc" rx="16"/>

  <!-- Title -->
  <text x="450" y="45" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">
    Client-Server Web Architecture Diagram
  </text>
  <text x="450" y="70" font-family="'Segoe UI', sans-serif" font-size="14" fill="#64748b" text-anchor="middle">
    Portfolio Request &amp; Dynamic Content Flow (Sanket Ambre)
  </text>

  <!-- CLIENT BOX -->
  <g transform="translate(60, 130)">
    <rect width="210" height="260" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))"/>
    <rect width="210" height="48" rx="12" fill="url(#clientGrad)"/>
    <text x="105" y="30" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">
      Client (Browser)
    </text>
    <text x="15" y="80" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1e293b">• Web Browser (Chrome/Edge)</text>
    <text x="15" y="105" font-family="'Segoe UI', sans-serif" font-size="13" fill="#475569">• DNS Cache &amp; TCP Socket</text>
    <text x="15" y="130" font-family="'Segoe UI', sans-serif" font-size="13" fill="#475569">• DOM &amp; CSSOM Parsers</text>
    <text x="15" y="155" font-family="'Segoe UI', sans-serif" font-size="13" fill="#475569">• V8 JavaScript Engine</text>
    <text x="15" y="180" font-family="'Segoe UI', sans-serif" font-size="13" fill="#475569">• Local Cache / Storage</text>
    <rect x="15" y="210" width="180" height="32" rx="6" fill="#eff6ff"/>
    <text x="105" y="231" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">
      Presentation Tier
    </text>
  </g>

  <!-- WEB SERVER & APP LOGIC BOX -->
  <g transform="translate(345, 130)">
    <rect width="220" height="260" rx="12" fill="#ffffff" stroke="#6ee7b7" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))"/>
    <rect width="220" height="48" rx="12" fill="url(#serverGrad)"/>
    <text x="110" y="30" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">
      Web &amp; App Server
    </text>
    <text x="15" y="80" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1e293b">• Web Server (Nginx/Apache)</text>
    <text x="15" y="105" font-family="'Segoe UI', sans-serif" font-size="13" fill="#475569">• Application Logic</text>
    <text x="15" y="130" font-family="'Segoe UI', sans-serif" font-size="12" fill="#047857">  (Node.js / Express / Java)</text>
    <text x="15" y="155" font-family="'Segoe UI', sans-serif" font-size="13" fill="#475569">• REST API Controller</text>
    <text x="15" y="180" font-family="'Segoe UI', sans-serif" font-size="13" fill="#475569">• Authentication &amp; Logic</text>
    <rect x="15" y="210" width="190" height="32" rx="6" fill="#ecfdf5"/>
    <text x="110" y="231" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#047857" text-anchor="middle">
      Business Logic Tier
    </text>
  </g>

  <!-- DATABASE SERVER BOX -->
  <g transform="translate(640, 130)">
    <rect width="200" height="260" rx="12" fill="#ffffff" stroke="#fcd34d" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))"/>
    <rect width="200" height="48" rx="12" fill="url(#dbGrad)"/>
    <text x="100" y="30" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">
      Database Server
    </text>
    <text x="15" y="80" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1e293b">• RDBMS / NoSQL</text>
    <text x="15" y="105" font-family="'Segoe UI', sans-serif" font-size="13" fill="#475569">• MySQL / PostgreSQL</text>
    <text x="15" y="130" font-family="'Segoe UI', sans-serif" font-size="13" fill="#475569">• MongoDB / Redis</text>
    <text x="15" y="155" font-family="'Segoe UI', sans-serif" font-size="13" fill="#475569">• Persistent Storage</text>
    <text x="15" y="180" font-family="'Segoe UI', sans-serif" font-size="13" fill="#475569">• ACID Transactions</text>
    <rect x="15" y="210" width="170" height="32" rx="6" fill="#fffbeb"/>
    <text x="100" y="231" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">
      Data Tier
    </text>
  </g>

  <!-- ARROWS BETWEEN CLIENT & SERVER -->
  <path d="M 270 210 L 340 210" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="305" y="198" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle">1. HTTP GET / POST</text>

  <path d="M 340 260 L 275 260" stroke="#059669" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="305" y="280" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">4. HTTP 200 OK (HTML/JSON)</text>

  <!-- ARROWS BETWEEN SERVER & DATABASE -->
  <path d="M 565 210 L 635 210" stroke="#d97706" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="600" y="198" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#d97706" text-anchor="middle">2. SQL Query</text>

  <path d="M 635 260 L 570 260" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="600" y="280" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">3. Result Records</text>

  <!-- FOOTER NOTE -->
  <rect x="60" y="420" width="780" height="40" rx="8" fill="#e2e8f0"/>
  <text x="450" y="445" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">
    Application Logic sits on the Web &amp; App Server Tier &bull; Database sits securely behind private network in the Data Tier
  </text>
</svg>
