<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="40%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  
  <!-- Subtle coffee cup and grain steam art -->
  <circle cx="1020" cy="200" r="140" fill="#f59e0b" opacity="0.1" />
  <circle cx="1020" cy="200" r="100" fill="#fb923c" opacity="0.15" />
  
  <!-- Steam swirls -->
  <path d="M980 140 Q1000 90 980 50 Q960 20 990 0" stroke="#fef08a" stroke-width="4" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M1020 140 Q1040 85 1020 45 Q1000 15 1030 0" stroke="#fef08a" stroke-width="4" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M1060 140 Q1080 90 1060 50 Q1040 20 1070 0" stroke="#fef08a" stroke-width="4" fill="none" opacity="0.4" stroke-linecap="round"/>

  <!-- Coffee Mug Outline -->
  <path d="M960 160 L1080 160 C1080 230 1040 250 1020 250 C1000 250 960 230 960 160 Z" fill="#78350f" stroke="#fbbf24" stroke-width="6"/>
  <path d="M1080 180 Q1120 180 1120 205 Q1120 230 1080 230" stroke="#fbbf24" stroke-width="6" fill="none"/>
  
  <!-- Branding Text -->
  <text x="80" y="150" font-family="'Segoe UI', sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="1">
    NEBULA NITRO ROASTERY
  </text>
  <text x="80" y="210" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="600" fill="url(#accentGrad)">
    Artisanal Micro-Lot Coffee &amp; Sourdough Craft Bakes
  </text>
  <text x="80" y="260" font-family="'Segoe UI', sans-serif" font-size="18" fill="#e2e8f0" letter-spacing="0.5">
    Cold Brew Infusions &bull; Wild Yeast Viennoiserie &bull; Direct-Trade Single Origins
  </text>
</svg>
