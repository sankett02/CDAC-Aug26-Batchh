
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bank Account Details</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body class="bg-light">
  <div class="container mt-5">
    <div class="card mx-auto p-4 shadow" style="max-width: 550px;">
      <h2 class="text-primary mb-4">Account Details</h2>

      <form id="accountForm">
        <div class="mb-3">
          <label for="accountId" class="form-label">Account ID</label>
          <input type="number" id="accountId" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="accountName" class="form-label">Account Name</label>
          <input type="text" id="accountName" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="accountType" class="form-label">Account Type</label>
          <select id="accountType" class="form-select" required>
            <option value="">Select account type</option>
            <option value="Savings">Savings</option>
            <option value="Current">Current</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="balance" class="form-label">Balance (Rs.)</label>
          <input type="number" id="balance" class="form-control"
                 min="5000" step="any" required>
        </div>

        <div class="mb-3">
          <label for="creationDate" class="form-label">Creation Date</label>
          <input type="date" id="creationDate" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary">Save info</button>
        <button type="button" id="showAccounts" class="btn btn-success">
          Account Info
        </button>
      </form>

      <p id="message" class="mt-3 mb-0"></p>
    </div>
  </div>

  <script>
    // Array to store account objects
    const accounts = [];

    $("#accountForm").on("submit", function (event) {
      event.preventDefault();

      const accountId = $("#accountId").val().trim();
      const accountName = $("#accountName").val().trim();
      const accountType = $("#accountType").val();
      const balanceText = $("#balance").val().trim();
      const creationDate = $("#creationDate").val();

      // Validate mandatory fields
      if (!accountId || !accountName || !accountType ||
          !balanceText || !creationDate) {
        $("#message").attr("class", "mt-3 text-danger")
                     .text("All fields are mandatory.");
        return;
      }

      const balance = Number(balanceText);

      // Validate numeric balance and minimum amount
      if (!Number.isFinite(balance) || balance < 5000) {
        $("#message").attr("class", "mt-3 text-danger")
                     .text("Balance must be numeric and at least Rs. 5000.");
        return;
      }

      // Convert form values into a JavaScript object
      const account = {
        accountId: Number(accountId),
        accountName: accountName,
        accountType: accountType,
        balance: balance,
        creationDate: creationDate
      };

      // Store object in the array
      accounts.push(account);

      $("#message").attr("class", "mt-3 text-success")
                   .text("Account saved successfully!");

      this.reset();
      console.log("Saved account:", account);
    });

    // Display all stored accounts in the console
    $("#showAccounts").on("click", function () {
      console.log("All Account Details:", accounts);
    });
  </script>
</body>
</html>
